x-app: &app
  build:
    context: ./backend
    target: base
  volumes:
    - storage_data:/var/www/storage
  environment:
    - APP_ENV=production
    - APP_DEBUG=false
    - DB_CONNECTION=pgsql
    - DB_HOST=postgres
    - DB_PORT=5432
    - DB_DATABASE=ugclab
    - DB_USERNAME=ugclab
    - DB_PASSWORD=${DB_PASSWORD:-secret}
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    - REDIS_PASSWORD=null
    - SESSION_DRIVER=redis
    - QUEUE_CONNECTION=redis
    - CACHE_STORE=redis
    - LOG_CHANNEL=stack
    - LOG_STACK=daily
    - LOG_LEVEL=error
  networks:
    - app-network
  restart: unless-stopped

services:
  app:
    <<: *app
    container_name: ugclab-app
    expose:
      - 9000
    healthcheck:
      test: ["CMD", "php", "artisan", "health:check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  web:
    image: nginx:1.27-alpine
    container_name: ugclab-web
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - storage_data:/var/www/storage:ro
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8080:80"
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: base
    container_name: ugclab-frontend
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.ugclab.com/api
      - NEXT_TELEMETRY_DISABLED=1
    expose:
      - 3000
    networks:
      - app-network
    restart: unless-stopped

  queue-worker:
    <<: *app
    build:
      context: ./backend
      target: queue-worker
    container_name: ugclab-queue-worker
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    <<: *app
    build:
      context: ./backend
      target: scheduler
    container_name: ugclab-scheduler
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: ugclab-postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=ugclab
      - POSTGRES_USER=ugclab
      - POSTGRES_PASSWORD=${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ugclab"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ugclab-redis
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    container_name: ugclab-caddy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
      - frontend
    networks:
      - app-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  storage_data:
  caddy_data:
  caddy_config:

networks:
  app-network:
    driver: bridge
