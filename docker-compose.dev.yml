services:
  app:
    build:
      target: base
    volumes:
      - ./backend:/var/www
      - /var/www/vendor
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - LOG_LEVEL=debug

  web:
    volumes:
      - ./backend:/var/www
    ports:
      - "8080:80"

  frontend:
    build:
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api
    ports:
      - "3000:3000"

  queue-worker:
    build:
      context: ./backend
      target: queue-worker
    volumes:
      - ./backend:/var/www
      - /var/www/vendor
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - LOG_LEVEL=debug

  scheduler:
    build:
      context: ./backend
      target: scheduler
    volumes:
      - ./backend:/var/www
      - /var/www/vendor
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - LOG_LEVEL=debug

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  caddy:
    ports:
      - "80:80"
      - "443:443"
